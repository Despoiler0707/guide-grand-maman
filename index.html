<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide pas-à-pas à grand-maman</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230E6B63%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2736%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27bold%27%3E%3F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Mise en page : accueil en grandes tuiles ; guide en « une étape à la fois » avec photo et repères ; police conçue pour la basse vision */
:root{
  --fond:#F4F6F4; --surface:#FFFFFF; --texte:#1C2430; --texte-2:#4A5563; --ligne:#D3DAD6;
  --accent:#0E6B63; --accent-fonce:#0A4F49; --accent-pale:#E1F0EC; --sur-accent:#FFFFFF;
  --repere:#E8A100; --fleche:#D62828; --c-bleu:#1554B8; --c-rouge:#B3141E; --c-vert:#17793F; --c-jaune:#8A6400; --aide:#9A4A12; --aide-pale:#FBEEE2;
  --f:"Atkinson Hyperlegible","Verdana","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --fond:#121614; --surface:#1B201E; --texte:#EEF2EF; --texte-2:#B3BDB8; --ligne:#2E3633;
  --accent:#5FC2B5; --accent-fonce:#8ED8CD; --accent-pale:#1E3532; --sur-accent:#0B1513;
  --repere:#FFC23D; --fleche:#FF5C5C; --c-bleu:#7FB0FF; --c-rouge:#FF7A7A; --c-vert:#6BD69A; --c-jaune:#FFD35C; --aide:#F0A06A; --aide-pale:#33241A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fond:#121614; --surface:#1B201E; --texte:#EEF2EF; --texte-2:#B3BDB8; --ligne:#2E3633;
  --accent:#5FC2B5; --accent-fonce:#8ED8CD; --accent-pale:#1E3532; --sur-accent:#0B1513;
  --repere:#FFC23D; --fleche:#FF5C5C; --c-bleu:#7FB0FF; --c-rouge:#FF7A7A; --c-vert:#6BD69A; --c-jaune:#FFD35C; --aide:#F0A06A; --aide-pale:#33241A; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:20px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--f);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font-family:inherit}
:focus-visible{outline:4px solid var(--repere);outline-offset:3px}
[hidden]{display:none!important}
.conteneur{max-width:980px;margin:0 auto}

header.site{padding-block:28px 12px}
header.site h1{margin:0;font-size:2rem;line-height:1.15;color:var(--accent-fonce);text-wrap:balance}
header.site p{margin:6px 0 0;font-size:1.1rem;color:var(--texte-2)}

/* Accueil */
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px}
.tuile{display:flex;gap:18px;align-items:center;text-align:left;background:var(--surface);color:var(--texte);
  border:2px solid var(--ligne);border-radius:18px;padding:22px;cursor:pointer;font-size:1rem;min-height:120px}
.tuile:hover{border-color:var(--accent);background:var(--accent-pale)}
.tuile .ico{flex:none;width:72px;height:72px;border-radius:16px;background:var(--accent);color:var(--sur-accent);display:grid;place-items:center}
.tuile .ico svg{width:44px;height:44px}
.tuile b{display:block;font-size:1.25rem;line-height:1.25;margin-bottom:4px}
.tuile span{color:var(--texte-2);font-size:.95rem}
.vide{margin-top:24px;padding:24px;background:var(--surface);border:2px dashed var(--ligne);border-radius:18px;color:var(--texte-2)}

/* Guide */
.barre{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:20px 6px}
.btn{border:2px solid var(--accent);background:var(--surface);color:var(--accent-fonce);border-radius:14px;
  font-size:1.05rem;font-weight:700;padding:12px 20px;min-height:56px;cursor:pointer}
.btn:hover{background:var(--accent-pale)}
.btn.plein{background:var(--accent);color:var(--sur-accent)}
.btn.plein:hover{background:var(--accent-fonce);border-color:var(--accent-fonce)}
.btn.aide{border-color:var(--aide);color:var(--aide)}
.btn.aide:hover,.btn.aide[aria-expanded="true"]{background:var(--aide-pale)}
.titre-guide{margin:4px 0 0;font-size:1.8rem;line-height:1.2;text-wrap:balance}
.progres{display:flex;align-items:center;gap:14px;margin:16px 0 8px;font-size:1.05rem;color:var(--texte-2);font-weight:700}
.points{display:flex;gap:8px;flex-wrap:wrap}
.point{width:16px;height:16px;border-radius:50%;background:var(--ligne);border:none;padding:0;cursor:pointer}
.point.fait{background:var(--accent)}
.point.actuel{background:var(--repere);transform:scale(1.25)}

.etape{background:var(--surface);border:2px solid var(--ligne);border-radius:20px;padding:24px;margin-top:8px}
.etape .entete{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.num{flex:none;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--sur-accent);
  display:grid;place-items:center;font-size:1.6rem;font-weight:700}
.etape h3{margin:0;font-size:1.5rem;line-height:1.2}
.texte p{margin:0 0 10px;font-size:1.25rem}
.texte strong{color:var(--accent-fonce)}
.couleur{font-weight:700;white-space:nowrap}
.couleur i{display:inline-block;width:.85em;height:.85em;border-radius:50%;margin-right:.35em;vertical-align:-.05em;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ligne)}
.couleur.bleu{color:var(--c-bleu)} .couleur.bleu i{background:#1E6FE8}
.couleur.rouge{color:var(--c-rouge)} .couleur.rouge i{background:#D62828}
.couleur.vert{color:var(--c-vert)} .couleur.vert i{background:#1F9D55}
.couleur.jaune{color:var(--c-jaune)} .couleur.jaune i{background:#F2B705}
.photo{position:relative;margin-top:16px;border-radius:14px;overflow:hidden;border:2px solid var(--ligne);max-width:100%}
.photo img{display:block;width:100%;height:auto}
.etape.compacte .photo{max-width:560px}
.repere{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:6px solid var(--repere);box-shadow:0 0 0 4px rgba(0,0,0,.35);pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}
.fleches{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fleches .contour{stroke:rgba(0,0,0,.45);fill:rgba(0,0,0,.45)}
.fleches .trait{stroke:var(--fleche);fill:var(--fleche)}
.fleches g{animation:pousse 1.4s ease-in-out infinite}
@keyframes pousse{50%{transform:translate(var(--dx),var(--dy))}}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.nav .btn{min-height:72px;font-size:1.25rem}
.fini{text-align:center;background:var(--accent-pale);border:2px solid var(--accent);border-radius:20px;padding:28px;margin-top:8px}
.fini h3{margin:0 0 8px;font-size:1.6rem;color:var(--accent-fonce)}
.fini p{margin:0 0 16px;font-size:1.2rem}

.problemes{margin-top:22px;background:var(--aide-pale);border:2px solid var(--aide);border-radius:20px;padding:20px}
.problemes h2{margin:0 0 12px;font-size:1.4rem;color:var(--aide)}
details{background:var(--surface);border:2px solid var(--ligne);border-radius:14px;margin-top:12px}
summary{cursor:pointer;padding:16px 18px;font-size:1.2rem;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.6rem;line-height:1;color:var(--aide)}
details[open] summary::after{content:"–"}
details .corps{padding:0 18px 18px}

.liens-bas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.lien{background:none;border:none;color:var(--accent-fonce);text-decoration:underline;font-size:1rem;cursor:pointer;padding:8px 4px;min-height:44px}
.etat{margin-top:28px;font-size:.8rem;color:var(--texte-2)}

@media (max-width:560px){
  html{font-size:18px}
  .etape{padding:18px}
  .nav{grid-template-columns:1fr}
  .nav .precedent{order:2}
}
@media (prefers-reduced-motion:reduce){ .repere,.fleches g{animation:none} }
@media print{
  html{font-size:14px}
  body{background:#fff;color:#000}
  .barre,.nav,.liens-bas,.progres,.btn,.etat,#accueil{display:none!important}
  .etape,.problemes,details{break-inside:avoid;border-color:#999}
  details .corps{display:block}
  .repere{animation:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="conteneur">
  <header class="site">
    <h1 id="titreSite">Guide pas-à-pas à grand-maman</h1>
    <p id="sousTitre">Choisis ce que tu veux faire. On y va une étape à la fois.</p>
  </header>

  <main id="accueil">
    <div class="tuiles" id="tuiles"></div>
  </main>

  <main id="vueGuide" hidden>
    <div class="barre">
      <button class="btn" id="btnAccueil" type="button">← Retour à l'accueil</button>
      <button class="btn aide" id="btnProblemes" type="button" aria-expanded="false" aria-controls="problemes">Ça ne marche pas ?</button>
    </div>
    <h2 class="titre-guide" id="titreGuide"></h2>
    <div class="progres" id="progres"></div>
    <div id="zoneEtapes"></div>
    <section class="problemes" id="problemes" hidden>
      <h2>Ça ne marche pas ? Choisis ce qui arrive :</h2>
      <div id="listeProblemes"></div>
    </section>
  </main>

  <p class="etat" id="etat"></p>
</div>

const CLE_CACHE = "guide-pratique-cache";

async function charger(){
  const etat = document.getElementById("etat");
  if(!API || API.startsWith("__")){ etat.textContent = ""; return; }
  try{
    const r = await fetch(API);
    const d = await r.json();
    if(!d.ok || !Array.isArray(d.guides)) throw 0;
    contenu = { guides:d.guides, etapes:d.etapes || [] };
    try{ localStorage.setItem(CLE_CACHE, JSON.stringify(contenu)); }catch(e){}
    etat.textContent = "";
    afficher();
  }catch(e){
    etat.textContent = "Contenu hors ligne : la dernière version connue est affichée.";
  }
}

/* ===================== OUTILS ===================== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function enHtml(texte){
  return String(texte ?? "").split(/\n+/).filter(l => l.trim()).map(l =>
    "<p>" + esc(l.trim()).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\{(bleu|rouge|vert|jaune):(.+?)\}/g, '<span class="couleur $1"><i aria-hidden="true"></i>$2</span>') + "</p>").join("");
}
function srcImage(nom){
  nom = String(nom || "").trim();
  if(!nom) return "";
  if(IMAGES[nom]) return IMAGES[nom];
  if(/^https:\/\//.test(nom)){
    const m = nom.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/);   // lien de partage Google Drive
    return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200" : nom;
  }
  return "";
}
function blocPhoto(image, reperes){
  const src = srcImage(image);
  if(!src) return "";
  let ronds = "", fleches = [];
  String(reperes || "").split(";").map(t => t.trim()).filter(Boolean).forEach(t => {
    const estFleche = /^fl[eè]che/i.test(t);
    const n = t.replace(/^fl[eè]che\s*:?\s*/i, "").split(",").map(v => parseFloat(v));
    if(!n.every(v => isFinite(v))) return;
    if(estFleche && n.length === 4) fleches.push(n.join(","));
    else if(!estFleche && (n.length === 2 || n.length === 3))
      ronds += `<span class="repere" style="left:${n[0]}%;top:${n[1]}%;width:${n[2] || 15}%"></span>`;
  });
  const svg = fleches.length ? `<svg class="fleches" aria-hidden="true" data-f="${fleches.join(";")}"></svg>` : "";
  return `<div class="photo"><img src="${esc(src)}" alt="" loading="lazy">${ronds}${svg}</div>`;
}
/* Dessine les flèches à l'échelle réelle de la photo (x et y en % de la photo) */
function dessinerFleches(photo){
  const svg = photo.querySelector("svg.fleches"), img = photo.querySelector("img");
  if(!svg) return;
  const r = (img && img.naturalWidth) ? img.naturalHeight / img.naturalWidth : 0.5625;
  const H = 100 * r, NS = "http://www.w3.org/2000/svg";
  svg.setAttribute("viewBox", `0 0 100 ${H}`);
  svg.innerHTML = "";
  svg.dataset.f.split(";").forEach(f => {
    const [x1, y1p, x2, y2p] = f.split(",").map(Number), y1 = y1p * r, y2 = y2p * r;
    const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    const tete = 5, demi = 3.6, bx = x2 - ux * tete, by = y2 - uy * tete;
    const pts = `${x2},${y2} ${bx - uy * demi},${by + ux * demi} ${bx + uy * demi},${by - ux * demi}`;
    const g = document.createElementNS(NS, "g");
    g.style.setProperty("--dx", (ux * 1.5) + "px"); g.style.setProperty("--dy", (uy * 1.5) + "px");
    g.innerHTML = `<line class="contour" x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke-width="2.6" stroke-linecap="round"/>
      <polygon class="contour" points="${pts}" stroke-width="1.2" stroke-linejoin="round"/>
      <line class="trait" x1="${x1}" y1="${y1}" x2="${bx + ux}" y2="${by + uy}" stroke-width="1.6" stroke-linecap="round"/>
      <polygon class="trait" points="${pts}" stroke-width="0.2" stroke-linejoin="round"/>`;
    svg.appendChild(g);
  });
}
function preparerPhotos(){
  document.querySelectorAll(".photo").forEach(ph => {
    dessinerFleches(ph);
    const img = ph.querySelector("img");
    if(img && !img.complete) img.addEventListener("load", () => dessinerFleches(ph), { once:true });
  });
}
const lignesDe = (id, section) => contenu.etapes.filter(e => e.guide === id && e.section === section);

/* ===================== AFFICHAGE ===================== */
let guideActuel = null, etapeActuelle = 0, toutVoir = false;

function afficher(){
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const g = contenu.guides.find(x => x.id === id);
  document.getElementById("accueil").hidden = !!g;
  document.getElementById("vueGuide").hidden = !g;
  if(!g){ guideActuel = null; afficherAccueil(); document.title = TITRE_SITE; return; }
  if(guideActuel !== g.id){ guideActuel = g.id; etapeActuelle = 0; toutVoir = false; fermerProblemes(); }
  document.title = g.titre + " · " + TITRE_SITE;
  afficherGuide(g);
}

function afficherAccueil(){
  const z = document.getElementById("tuiles"); z.innerHTML = "";
  if(!contenu.guides.length){
    z.innerHTML = `<div class="vide">Aucun guide pour l'instant.</div>`; return;
  }
  contenu.guides.forEach(g => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tuile";
    b.innerHTML = `<span class="ico" aria-hidden="true">${ICONES[g.icone] || ICONES.aide}</span><span><b></b><span></span></span>`;
    b.querySelector("b").textContent = g.titre;
    b.querySelector("span > span").textContent = g.description || "";
    b.onclick = () => { location.hash = encodeURIComponent(g.id); };
    z.appendChild(b);
  });
}

function carteEtape(e, i, total, compacte){
  return `<article class="etape${compacte ? " compacte" : ""}">
    <div class="entete"><span class="num">${i+1}</span><h3>${esc(e.titre)}</h3></div>
    <div class="texte">${enHtml(e.texte)}</div>
    ${blocPhoto(e.image, e.reperes)}
  </article>`;
}

function afficherGuide(g){
  const etapes = lignesDe(g.id, "etape");
  const total = etapes.length;
  document.getElementById("titreGuide").textContent = g.titre;
  const zone = document.getElementById("zoneEtapes");
  const progres = document.getElementById("progres");

  if(toutVoir || !total){
    progres.innerHTML = "";
    zone.innerHTML = total ? etapes.map((e,i) => carteEtape(e, i, total, true)).join("")
                           : `<div class="vide">Ce guide n'a pas encore d'étapes.</div>`;
  } else if(etapeActuelle >= total){
    progres.innerHTML = "";
    zone.innerHTML = `<div class="fini"><h3>C'est fait, bravo !</h3>
      <p>Bonne écoute !</p>
      <div class="nav"><button class="btn precedent" type="button" data-aller="${total-1}">← Revoir la dernière étape</button>
      <button class="btn plein" type="button" data-accueil>Retour à l'accueil</button></div></div>`;
  } else {
    progres.innerHTML = `<span>Étape ${etapeActuelle+1} sur ${total}</span><span class="points">${
      etapes.map((_,i) => `<button class="point${i < etapeActuelle ? " fait" : ""}${i === etapeActuelle ? " actuel" : ""}" type="button" data-aller="${i}" aria-label="Aller à l'étape ${i+1}"></button>`).join("")}</span>`;
    zone.innerHTML = carteEtape(etapes[etapeActuelle], etapeActuelle, total, false) +
      `<div class="nav">
        <button class="btn precedent" type="button" data-aller="${etapeActuelle-1}" ${etapeActuelle === 0 ? "hidden" : ""}>← Étape précédente</button>
        <button class="btn plein" type="button" data-aller="${etapeActuelle+1}" style="grid-column:${etapeActuelle === 0 ? "1 / -1" : "auto"}">${etapeActuelle === total-1 ? "J'ai terminé ✓" : "C'est fait, étape suivante →"}</button>
      </div>`;
  }

  const probs = AFFICHER_PROBLEMES ? lignesDe(g.id, "probleme") : [];
  document.getElementById("btnProblemes").hidden = !probs.length;
  document.getElementById("listeProblemes").innerHTML = probs.map(p =>
    `<details><summary>${esc(p.titre)}</summary><div class="corps texte">${enHtml(p.texte)}${blocPhoto(p.image, p.reperes)}</div></details>`).join("");
  preparerPhotos();
}

function allerA(i){
  etapeActuelle = Math.max(0, i);
  afficherGuide(contenu.guides.find(x => x.id === guideActuel));
  document.getElementById("titreGuide").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start" });
  const suivant = document.querySelector("#zoneEtapes .btn.plein"); if(suivant) suivant.focus({ preventScroll:true });
}
function fermerProblemes(){
  document.getElementById("problemes").hidden = true;
  document.getElementById("btnProblemes").setAttribute("aria-expanded","false");
}

/* ===================== ÉVÉNEMENTS ===================== */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-aller]"); if(a){ allerA(Number(a.dataset.aller)); return; }
  if(e.target.closest("[data-accueil]")){ location.hash = ""; return; }
});
document.addEventListener("keydown", e => {
  if(!guideActuel || toutVoir || /INPUT|TEXTAREA|SUMMARY/.test(e.target.tagName)) return;
  const total = lignesDe(guideActuel, "etape").length;
  if(e.key === "ArrowRight" && etapeActuelle < total) allerA(etapeActuelle + 1);
  if(e.key === "ArrowLeft" && etapeActuelle > 0) allerA(etapeActuelle - 1);
});
document.getElementById("btnAccueil").onclick = () => { location.hash = ""; };
document.getElementById("btnProblemes").onclick = () => {
  const p = document.getElementById("problemes"), b = document.getElementById("btnProblemes");
  p.hidden = !p.hidden; b.setAttribute("aria-expanded", String(!p.hidden));
  if(!p.hidden) p.scrollIntoView({ behavior:"smooth", block:"start" });
};
window.addEventListener("hashchange", () => { afficher(); window.scrollTo(0,0); });

document.getElementById("titreSite").textContent = TITRE_SITE;
document.getElementById("sousTitre").textContent = SOUS_TITRE;
afficher();
charger();
</script>
</body>
</html>
